name: stallseeker
description: "A Flutter application for finding food stalls."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^7.2.0

  # Firebase Core & Services
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Maps & GPS Location
  google_maps_flutter: ^2.10.1
  geolocator: ^13.0.2

  # Utilities & Helpers
  provider: ^6.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
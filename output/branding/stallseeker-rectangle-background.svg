<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">StallSeeker rectangle background</title>
  <desc id="description">Editable vector recreation of the orange and red-orange square-corner logo background, with sweeping curved color shapes. The white storefront and location-pin symbol is omitted. The background fills the entire rectangular canvas.</desc>
  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB8D24"/>
      <stop offset="1" stop-color="#FA3A1E"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="55" y1="75" x2="850" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFAB24" stop-opacity="0.50"/>
      <stop offset="0.75" stop-color="#FF6B13" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6B13" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="right-sweep" x1="1024" y1="450" x2="420" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF391B" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#FA3A1E" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="lower-wave" x1="20" y1="610" x2="790" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5415" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#FF291B" stop-opacity="0.56"/>
    </linearGradient>
    <clipPath id="rounded-square">
      <rect x="0" y="0" width="1024" height="1024"/>
    </clipPath>
  </defs>
  <g id="background" clip-path="url(#rounded-square)">
    <rect id="base-gradient" x="0" y="0" width="1024" height="1024" fill="url(#brand-gradient)"/>
    <rect id="upper-left-glow" x="0" y="0" width="1024" height="1024" fill="url(#warm-glow)"/>
    <path id="right-curved-sweep" d="M 1024,350 C 908,535 760,588 592,699 C 453,791 365,907 300,1024 L 1024,1024 Z" fill="url(#right-sweep)"/>
    <path id="lower-left-wave" d="M 0,617 C 179,618 286,699 399,814 C 517,934 666,1005 829,1024 L 0,1024 Z" fill="url(#lower-wave)"/>
  </g>
</svg>

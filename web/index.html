<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find nearby food stalls and follow live updates.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6E41">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StallSeeker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StallSeeker</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="web-startup" role="status" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:24px;font:16px system-ui,sans-serif;text-align:center;color:#4b403b">Loading StallSeeker…</div>
  <script>
    // Install recovery before requesting any startup resources. Script failures
    // and requests that never finish must not leave an endless loading screen.
    (() => {
      let finished = false;
      let failed = false;
      const status = document.getElementById('web-startup');
      const timeout = setTimeout(() => fail('Loading is taking longer than expected. Check your connection and try again.'), 45000);
      function fail(message) {
        if (finished || failed) return;
        failed = true;
        clearTimeout(timeout);
        status.replaceChildren();
        const text = document.createElement('p');
        text.textContent = message;
        const retry = document.createElement('button');
        retry.textContent = 'Retry';
        retry.style.cssText = 'font:inherit;padding:10px 24px;cursor:pointer';
        retry.onclick = () => window.location.reload();
        status.append(text, retry);
      }
      window.stallSeekerStartup = {
        fail,
        complete() {
          finished = true;
          clearTimeout(timeout);
          status.remove();
        },
      };
      window.addEventListener('flutter-first-frame', window.stallSeekerStartup.complete, {once: true});
      window.addEventListener('error', (event) => {
        if (event.target instanceof HTMLScriptElement && !event.target.stallSeekerOptional) {
          fail('StallSeeker could not download a required file. Check your connection and retry.');
        }
      }, true);
      window.addEventListener('unhandledrejection', () => {
        fail('StallSeeker could not start. Check your connection and retry.');
      });
    })();

    // Claim an active in-app edge swipe before Safari starts browser navigation.
    window.stallSeekerRegisterTabBackGesture = (canGoBack, goBack) => {
      let start;
      const begin = event => {
        start = undefined;
        if (!event.cancelable || event.touches.length !== 1) return;
        const touch = event.touches[0];
        const fromLeft = touch.clientX <= 20;
        if (!fromLeft && touch.clientX < window.innerWidth - 20) return;
        if (!canGoBack(fromLeft)) return;
        event.preventDefault();
        start = {id: touch.identifier, x: touch.clientX, y: touch.clientY, fromLeft};
      };
      const end = event => {
        const gesture = start;
        start = undefined;
        if (!gesture || event.touches.length) return;
        const touch = Array.from(event.changedTouches).find(t => t.identifier === gesture.id);
        if (!touch) return;
        const dx = (touch.clientX - gesture.x) * (gesture.fromLeft ? 1 : -1);
        const dy = Math.abs(touch.clientY - gesture.y);
        if (dx >= 64 && dx > dy && canGoBack(gesture.fromLeft)) goBack();
      };
      const cancel = () => { start = undefined; };
      window.addEventListener('touchstart', begin, {capture: true, passive: false});
      window.addEventListener('touchend', end, true);
      window.addEventListener('touchcancel', cancel, true);
      return () => {
        window.removeEventListener('touchstart', begin, true);
        window.removeEventListener('touchend', end, true);
        window.removeEventListener('touchcancel', cancel, true);
      };
    };

    // Flutter supplies a new build identifier for each release build.
    window.stallSeekerRelease = {{flutter_service_worker_version}};
    const mapsLoader = document.createElement('script');
    mapsLoader.src = 'maps-bootstrap.js?v=' +
        encodeURIComponent(window.stallSeekerRelease || Date.now());
    document.body.appendChild(mapsLoader);
  </script>
</body>
</html>
